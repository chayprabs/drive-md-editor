<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>MarkDrive Open Graph</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #111820;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2dd4bf;
        --border: #28313d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background:
          linear-gradient(135deg, rgb(45 212 191 / 18%), transparent 34%),
          repeating-linear-gradient(0deg, rgb(230 237 243 / 4%) 0 1px, transparent 1px 42px),
          repeating-linear-gradient(90deg, rgb(230 237 243 / 3%) 0 1px, transparent 1px 42px),
          var(--bg);
        color: var(--text);
        font-family: Geist, Inter, Arial, sans-serif;
      }

      main {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 54px;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 82px;
      }

      .logo {
        display: grid;
        place-items: center;
        width: 220px;
        height: 220px;
        border: 1px solid var(--border);
        border-radius: 42px;
        background: var(--panel);
        box-shadow: 0 36px 100px rgb(0 0 0 / 42%);
      }

      .logo img {
        width: 168px;
        height: 168px;
      }

      section {
        display: grid;
        gap: 18px;
      }

      h1 {
        margin: 0;
        color: var(--accent);
        font-size: 116px;
        line-height: 0.92;
        letter-spacing: 0;
      }

      p {
        max-width: 700px;
        margin: 0;
        color: var(--text);
        font-size: 42px;
        line-height: 1.16;
        font-weight: 650;
      }

      code {
        width: fit-content;
        margin-top: 8px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
        background: rgb(13 17 23 / 72%);
        font: 24px/1.2 "JetBrains Mono", Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo"><img src="icon.svg" alt="" /></div>
      <section>
        <h1>MarkDrive</h1>
        <p>Your Markdown, native in Drive.</p>
        <code># edit .md directly in Google Drive</code>
      </section>
    </main>
  </body>
</html>
